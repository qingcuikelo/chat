repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --force-exclude --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (manual)
        entry: mypy app
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]
